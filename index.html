<style>
:root{
  --bg:#f3f0eb; --surface:#fbf9f6; --sand:#e6dccd; --sand-2:#d6c7b2;
  --brown:#6b3f1e; --brown-2:#4f2e16; --ink:#3a2a1e; --muted:#8a7866;
  --line:#e2d9cc; --over:#a2402c; --over-bg:#f3e1da;
  --r:18px; --pill:999px;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Assistant',-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:calc(var(--st) + 8px) 20px calc(var(--sb) + 40px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:58px;margin-bottom:6px}
.brand{font-family:var(--body);letter-spacing:.28em;text-transform:uppercase;font-size:14px;font-weight:600;color:var(--ink)}
.brandwrap{text-align:center;line-height:1.2}
.tagline{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.iconbtn:active{background:var(--sand)}
.iconbtn svg{width:22px;height:22px}
.spacer{width:40px}

.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 12px}
h2.sec{font-weight:400;font-size:22px;margin:30px 0 14px;color:var(--brown-2)}
.hero-line{font-family:var(--head);text-transform:uppercase;font-weight:600;font-size:34px;line-height:1.02;letter-spacing:.01em;margin:10px 0 6px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border-radius:var(--pill);background:var(--brown);color:#f7f1e8;font-weight:600;font-size:16px;letter-spacing:.01em}
.btn:active{background:var(--brown-2)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--brown);box-shadow:inset 0 0 0 1.5px var(--brown)}
.btn.ghost:active{background:var(--sand)}
.btn.danger{background:transparent;color:var(--over);box-shadow:inset 0 0 0 1.5px var(--over)}
.btn:disabled{opacity:.4}
.link{color:var(--brown);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:12px;border:1px solid var(--line)}
.card:active{transform:scale(.99)}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .name{font-weight:600;font-size:17px}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:var(--ink);color:#f3ede4;border-radius:var(--pill);padding:3px 10px}
.tag.soft{background:var(--sand);color:var(--brown-2)}
.card .amt{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;margin-top:10px;letter-spacing:.01em}
.card .amt small{font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.card .meta{color:var(--muted);font-size:14px;margin-top:2px}
.bar{height:8px;background:var(--sand);border-radius:var(--pill);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--brown);border-radius:var(--pill)}
.bar.over>i{background:var(--over)}
.neg{color:var(--over)}

/* big detail */
.big{background:var(--sand);border-radius:24px;padding:26px 22px 22px;text-align:center;margin-top:18px}
.big.over{background:var(--over-bg)}
.big .n{font-family:var(--head);font-weight:600;font-size:56px;line-height:1;letter-spacing:.01em}
.big .l{margin-top:8px;color:var(--brown-2)}
.big .bar{background:rgba(255,255,255,.6);height:10px;margin-top:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-family:var(--head);font-weight:500;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active{background:var(--bg)}
.item .dot{width:36px;height:36px;border-radius:50%;background:var(--sand);display:grid;place-items:center;flex:none;color:var(--brown)}
.item .dot svg{width:17px;height:17px}
.item .t{flex:1;min-width:0}
.item .t div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.item .v{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 16px}
.install{position:relative;background:var(--sand);border-radius:var(--r);padding:18px 20px 18px;margin:10px 0 4px}
.install .x{position:absolute;top:8px;right:8px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--brown-2)}
.install .x svg{width:18px;height:18px}
.install .it{font-family:var(--head);font-weight:600;text-transform:uppercase;font-size:20px;letter-spacing:.01em;padding-right:30px}
.install p{margin:6px 0 0}
.install .why1{color:var(--brown-2)}
.install .step{margin-top:12px;background:var(--surface);border-radius:12px;padding:12px 14px;line-height:1.9}
.install .small{font-size:13px;color:var(--muted);margin-top:8px}
.install .gi{width:20px;height:20px;vertical-align:-4px;color:#1a73e8;margin:0 2px}
.sblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;margin-top:14px}
.sblock .snum{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brown);font-weight:700}
.sblock .stitle{font-family:var(--head);font-weight:600;text-transform:uppercase;font-size:21px;line-height:1.15;margin:4px 0 6px}
.sblock p{margin:0 0 12px;color:var(--brown-2)}
.sblock p:last-child{margin-bottom:0}

const autoLang = () => { try { return /^fi\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'fi' : 'en'; } catch(e){ return 'en'; } };
let lang = 'en', T = LANG.en, dfmt, tfmt;
function applyLang(){
  lang = LANG[S.lang] ? S.lang : autoLang(); T = LANG[lang];
  const loc = lang === 'fi' ? 'fi-FI' : 'en-GB';
  dfmt = new Intl.DateTimeFormat(loc, lang === 'fi' ? {day:'numeric', month:'numeric'} : {day:'numeric', month:'short'});

/* ---------- money & dates ---------- */
const CUR = {
  EUR:{sym:'€', after:true, dec:',', grp:' '},
  GBP:{sym:'£', after:false, dec:'.', grp:','},
  USD:{sym:'$', after:false, dec:'.', grp:','},
  AUD:{sym:'A$', after:false, dec:'.', grp:','},
  SEK:{sym:'kr', after:true, dec:',', grp:' '},
  NOK:{sym:'kr', after:true, dec:',', grp:' '},
  DKK:{sym:'kr', after:true, dec:',', grp:'.'}
};
const curName = k => T.cur[k] || k;
const curOf = t => CUR[(t && t.cur) || S.cur] || CUR.EUR;
function num(c, C){ const a = Math.abs(c), w = Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, C.grp);
  return w + C.dec + String(a % 100).padStart(2, '0'); }
function money(c, C){ const n = num(c, C), sign = c < 0 ? '−' : '';
  return C.after ? sign + n + ' ' + C.sym : sign + C.sym + n; }
const fmtFor = t => { const C = curOf(t); return c => money(c, C); };
function parseFor(str, C){ let v = String(str).replace(/[\s ]/g, '');
  const other = C.dec === ',' ? '.' : ',';
  if (v.includes(C.dec)) v = v.split(other).join('');
  else if (v.includes(other) && /[.,]\d{1,2}$/.test(v) && v.split(other).length === 2) v = v.replace(other, C.dec);
  else v = v.split(other).join('');
  return parseCents(v.replace(C.dec, '.')); }
const inputStr = (c, C) => c ? (c / 100).toFixed(2).replace('.', C.dec) : '';
function parseCents(str){ const s = String(str).replace(/\s/g,'').replace(',', '.'); if (!/^\d*\.?\d{0,2}$/.test(s) || s === '' || s === '.') return NaN; return Math.round(parseFloat(s) * 100); }
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function addPeriod(t, p){ const d = new Date(t);
  if (p === 'weekly') d.setDate(d.getDate() + 7);
  else if (p === 'fortnightly') d.setDate(d.getDate() + 14);
  else if (p === 'monthly') d.setMonth(d.getMonth() + 1);
  return d.getTime(); }
function when(t){ const today = startOfDay(Date.now()), d = startOfDay(t);
  const day = d === today ? T.today : d === today - DAY ? T.yesterday : dfmt.format(t);
  return T.whenFmt(day, tfmt.format(t)); }
const range = t => dfmt.format(t.start) + '–' + dfmt.format((t.endedAt || t.end || Date.now()) - (t.end && !t.endedAt ? 1 : 0));

/* ---------- model ---------- */
const spent = t => t.expenses.reduce((a, e) => a + e.amount, 0);
const hasBudget = t => t.mode === 'budget';
const active = () => S.trackings.filter(t => t.status === 'active').sort((a,b) => a.created - b.created);
const history = () => S.trackings.filter(t => t.status === 'ended').sort((a,b) => (b.endedAt||0) - (a.endedAt||0));
const byId = id => S.trackings.find(t => t.id === id);

function rollover(){
  const now = Date.now(); let changed = false;
  for (const t0 of active()) {
    let t = t0;
    while (t.period !== 'oneoff' && t.end && now >= t.end) {
      t.status = 'ended'; t.endedAt = t.end;
      const n = { id: uid(), name: t.name, mode: t.mode, amount: t.amount, period: t.period, cur: t.cur,
        start: t.end, end: addPeriod(t.end, t.period), created: t.created, status: 'active', expenses: [] };
      S.trackings.push(n); t = n; changed = true;
    }
  }
  if (changed) save();
}

function summary(t){
  const s = spent(t), now = Date.now();
  const o = { spent: s, left: hasBudget(t) ? t.amount - s : null, pct: 0, over: false, days: null, perDay: null };
  if (hasBudget(t)) { o.pct = t.amount > 0 ? Math.min(100, s / t.amount * 100) : 100; o.over = o.left < 0; }
  if (t.end && t.status === 'active') {
    o.days = Math.max(1, Math.ceil((t.end - now) / DAY));
    if (hasBudget(t) && o.left > 0) o.perDay = Math.floor(o.left / o.days);
  }
  return o;
}

/* ---------- router ---------- */
const go = h => { location.hash = h; };
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollover(); render(); } });

function render(){
  try { renderInner(); } catch(err) {
    try { console.error(err); } catch(e){}
    $('#app').innerHTML = top('', '') + `<div class="hero-line" style="margin-top:20px">${T.errT}</div>
      <p class="sub">${T.errP}</p>
      <div class="actions"><button class="btn block" onclick="location.hash='';location.reload()">${T.tryAgain}</button>
      <button class="btn ghost block" onclick="WL.exportData()">${T.saveBackup}</button></div>
      <p class="hint" style="text-align:center">${esc(err && err.message)}</p>`;
  }
}
function renderInner(){
  closeSheet(true);
  const h = location.hash.replace(/^#\/?/, '');
  const [view, id] = h.split('/');
  const app = $('#app');
  if (view === 't' && byId(id)) app.innerHTML = viewTracking(byId(id));
  else if (view === 'new') app.innerHTML = viewForm(null);
  else if (view === 'edit' && byId(id)) app.innerHTML = viewForm(byId(id));
  else if (view === 'backup') app.innerHTML = viewBackup();
  else if (view === 'setup') app.innerHTML = viewSetup();
  else app.innerHTML = viewHome();
  if (view === 'new' || view === 'edit') bindForm(view === 'edit' ? byId(id) : null);
  pvClear(); startPreview();
  window.scrollTo(0, 0);
}

/* ---------- views ---------- */
function top(left, right, noTag){ return `<div class="top">${left || '<span class="spacer"></span>'}<div class="brandwrap"><div class="brand">What's Left?</div>${noTag ? '' : `<div class="tagline">${T.tagline}</div>`}</div>${right || '<span class="spacer"></span>'}</div>`; }
const backBtn = (to='') => `<button class="iconbtn" aria-label="${T.aria.back}" onclick="location.hash='${to}'">${I.back}</button>`;

function cardFor(t){
  const m = summary(t), eur = fmtFor(t);
  const tag = t.period === 'oneoff' ? '' : `<span class="tag soft">${T.periods[t.period]}</span>`;
  let amt, meta = '', bar = '';
  if (hasBudget(t)) {
    amt = `<span class="${m.over ? 'neg' : ''}">${eur(m.over ? -m.left : m.left)}</span><small>${m.over ? T.over : T.left}</small>`;
    bar = `<div class="bar ${m.over ? 'over' : ''}"><i style="width:${m.pct}%"></i></div>`;
    meta = m.days ? T.daysLeft(m.days) + (m.perDay != null ? ' · ' + T.perDay(eur(m.perDay)) : '') : T.ofSpent(eur(m.spent), eur(t.amount));
  } else {
    amt = `${eur(m.spent)}<small>${T.spentW}</small>`;
    meta = T.purchases(t.expenses.length) + (m.days ? ' · ' + T.daysLeft(m.days) : '');
  }
  return `<button class="card" onclick="location.hash='t/${t.id}'">
    <div class="row"><span class="name">${esc(t.name)}</span>${tag}</div>
    <div class="amt">${amt}</div>${bar}<div class="meta">${meta}</div></button>`;
}

function startPreview(){

}

}
const curSelect = (id, v, on='') => `<select class="inp" id="${id}" ${on ? `onchange="${on}"` : ''}>${Object.entries(CUR).map(([k,c]) => `<option value="${k}" ${k===v?'selected':''}>${curName(k)} (${c.sym})</option>`).join('')}</select>`;
const foot = () => `<div class="foot">${T.foot}<br><a class="link" href="#backup">${T.footLink}</a></div>`;

function viewTracking(t){
  const m = summary(t), ended = t.status === 'ended', eur = fmtFor(t);
  const more = `<button class="iconbtn" aria-label="${T.aria.options}" onclick="WL.options('${t.id}')">${I.more}</button>`;
  let out = top(backBtn(''), more);
  out += `<div class="eyebrow" style="margin-top:14px">${ended ? T.histEyebrow + ' · ' + range(t) : (t.period === 'oneoff' ? T.periods.oneoff.toLowerCase() : T.periods[t.period].toLowerCase() + ' · ' + range(t))}</div>`;
  out += `<div class="hero-line" style="font-size:30px">${esc(t.name)}</div>`;
  if (hasBudget(t)) {
    out += `<div class="big ${m.over ? 'over' : ''}"><div class="n ${m.over ? 'neg' : ''}">${eur(m.over ? -m.left : m.left)}</div>
      <div class="l">${m.over ? T.overBudget : (ended ? T.wasLeft : T.left)}</div>
      <div class="bar ${m.over ? 'over' : ''}"><i style="width:${m.pct}%"></i></div></div>`;
    out += `<div class="stats">`;
    if (!ended && m.days) out += `<div class="stat"><b>${m.days}</b><span>${T.daysRemaining(m.days)}</span></div><div class="stat"><b>${m.perDay != null ? eur(m.perDay) : '—'}</b><span>${T.perDayL}</span></div>`;
    else out += `<div class="stat"><b>${eur(m.spent)}</b><span>${T.spentW}</span></div><div class="stat"><b>${eur(t.amount)}</b><span>${T.budget}</span></div>`;
    out += `</div>`;
  } else {
    out += `<div class="big"><div class="n">${eur(m.spent)}</div><div class="l">${T.spentW}${t.expenses.length ? ' · ' + T.purchases(t.expenses.length) : ''}</div></div>`;
  }
  if (!ended) out += `<div class="actions" style="margin-top:16px"><button class="btn block" onclick="WL.addExpense('${t.id}')">${I.plus} ${T.addExpense}</button></div>`;
  else out += `<div class="actions" style="margin-top:16px"><button class="btn ghost block" onclick="WL.reopen('${t.id}')">${T.reopen}</button></div>`;
  out += `<h2 class="sec">${T.purchasesTitle}</h2>`;
  const ex = [...t.expenses].sort((a,b) => b.t - a.t);
  out += ex.length ? `<div class="list">${ex.map(e => `<button class="item" onclick="WL.editExpense('${t.id}','${e.id}')"><span class="dot">${I.coin}</span><div class="t"><div>${esc(e.note || T.purchaseDefault)}</div><span>${when(e.t)}</span></div><div class="v">${eur(e.amount)}</div></button>`).join('')}</div>`
    : `<div class="list"><div class="empty">${T.nothingYet}</div></div>`;
  return out;
}

function viewForm(t){
  const e = t || { name:'', mode:'budget', amount:0, period:'oneoff', cur: S.cur || 'EUR' };
  const C = CUR[e.cur] || CUR.EUR, ck = CUR[e.cur] ? e.cur : 'EUR';
  let out = top(backBtn(t ? 't/' + t.id : ''), '');
  out += `<div class="hero-line" style="margin-top:16px">${t ? T.editT : T.newT}</div>`;
  out += `<label class="f" for="fName">${T.nameL}</label><input class="inp" id="fName" maxlength="40" placeholder="${T.namePh}" value="${esc(e.name)}">`;
  out += `<label class="f">${T.howTrack}</label><div class="seg opts" id="fMode">
    <button type="button" data-v="budget" aria-pressed="${e.mode==='budget'}"><b>${T.withAmount}</b><span>${T.withAmountN}</span></button>
    <button type="button" data-v="zero" aria-pressed="${e.mode==='zero'}"><b>${T.atZero}</b><span>${T.atZeroN}</span></button></div>`;
  out += `<div id="fAmtWrap"><label class="f" for="fAmt">${T.howMuch}</label><div class="money ${C.after ? 'after' : ''}" id="fMoney"><button type="button" class="sym" id="fSym" aria-label="${T.aria.changeCur}"><span id="fSymT">${C.sym}</span><svg viewBox="0 0 10 6" width="9" height="6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l4 4 4-4"/></svg></button><input class="inp" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0${C.dec}00" value="${inputStr(e.amount, C)}"></div></div>`;
  out += `<p class="curline" id="fCurLine"><span id="fCurName">${curName(ck)} (${C.sym})</span> · <button type="button" class="link" id="fCurChange">${T.change}</button></p>`;
  out += `<label class="f">${T.periodL}</label><div class="seg" id="fPeriod">${Object.entries(T.periods).map(([k,v]) => `<button type="button" data-v="${k}" aria-pressed="${e.period===k}">${v}</button>`).join('')}</div>`;
  out += `<p class="hint" id="fHint"></p>`;
  out += `<div class="actions"><button class="btn block" id="fSave">${t ? T.save : T.start}</button></div>`;
  return out;
}
function bindForm(t){
  let mode = t ? t.mode : 'budget', period = t ? t.period : 'oneoff';
  let cur = CUR[(t && t.cur) || S.cur] ? ((t && t.cur) || S.cur) : 'EUR';
  const setCur = k => { const prev = CUR[cur], C = CUR[k], v = parseFor($('#fAmt').value, prev); cur = k;
    $('#fSymT').textContent = C.sym; $('#fMoney').classList.toggle('after', C.after); $('#fCurName').textContent = curName(k) + ' (' + C.sym + ')';
    $('#fAmt').placeholder = '0' + C.dec + '00'; if (v > 0) $('#fAmt').value = inputStr(v, C); };
  const pickCur = () => {
    openSheet(`<div class="head"><button class="iconbtn" onclick="WL.close()" aria-label="${T.aria.close}">${I.close}</button><div>${T.currency}</div><span class="spacer"></span></div>
      <div class="list curpick" style="margin-top:8px">${Object.entries(CUR).map(([k,c]) => `<button class="item" data-k="${k}"><div class="t"><div>${curName(k)}</div></div><div class="v">${c.sym}${k === cur ? ' ✓' : ''}</div></button>`).join('')}</div>`);
    $('.curpick').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; setCur(b.dataset.k); closeSheet(); });
  };
  $('#fSym').onclick = pickCur; $('#fCurChange').onclick = pickCur;
  const seg = (id, set) => $(id).addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); set(b.dataset.v); upd(); });
  const upd = () => {
    $('#fAmtWrap').style.display = mode === 'budget' ? '' : 'none';
    $('#fCurLine').style.display = mode === 'budget' ? 'none' : '';
    $('#fHint').textContent = period === 'oneoff' ? T.hintOneoff : T.hintRecur(t ? dfmt.format(t.start) : T.todayLower, period);
  };
  seg('#fMode', v => mode = v); seg('#fPeriod', v => period = v); upd();
  if (!t) setTimeout(() => $('#fName').focus(), 50);
  $('#fSave').onclick = () => {
    const name = $('#fName').value.trim() || T.defName[period];
    let amount = 0;
    if (mode === 'budget') { amount = parseFor($('#fAmt').value, CUR[cur]); if (!(amount > 0)) { toast(T.needAmount); $('#fAmt').focus(); return; } }
    if (t) {
      Object.assign(t, { name, mode, amount, cur });
      if (t.period !== period) { t.period = period; t.end = period === 'oneoff' ? null : addPeriod(t.start, period); }
      save(); rollover(); go('t/' + (t.status === 'active' ? t.id : active().slice(-1)[0]?.id || ''));
    } else {
      const start = startOfDay(Date.now());
      S.cur = cur;
      const n = { id: uid(), name, mode, amount, period, cur, start, end: period === 'oneoff' ? null : addPeriod(start, period), created: Date.now(), status: 'active', expenses: [] };
      S.trackings.push(n); save(); location.replace('#t/' + n.id);
    }
  };
}

function viewBackup(){
  const n = S.trackings.length, ex = S.trackings.reduce((a,t) => a + t.expenses.length, 0);
  let out = top(backBtn(''), '');
  out += `<div class="hero-line" style="margin-top:16px">${T.settingsT}</div>
    <p class="sub">${T.settingsSub}</p>
    <label class="f">${T.langL}</label>
    <div class="seg" id="sLang"><button type="button" aria-pressed="${lang==='fi'}" onclick="WL.setLang('fi')">Suomi</button><button type="button" aria-pressed="${lang==='en'}" onclick="WL.setLang('en')">English</button></div>
    <label class="f" for="sCur">${T.defCur}</label>${curSelect('sCur', S.cur || 'EUR', "WL.setCur(this.value)")}
    <p class="hint">${T.defCurHint}</p>
    <div class="stats" style="margin-top:18px"><div class="stat"><b>${n}</b><span>${T.statTrack}</span></div><div class="stat"><b>${ex}</b><span>${T.statPurch}</span></div></div>
    <p class="hint" style="margin-top:22px;text-align:center"><b>${lastBackupText()}</b></p>
    <div class="actions" style="margin-top:12px"><button class="btn block" onclick="WL.exportData()">${T.saveBackup}</button>
    <button class="btn ghost block" onclick="document.getElementById('imp').click()">${T.restore}</button>
    <input type="file" id="imp" accept="application/json,.json" hidden onchange="WL.importData(this)"></div>
    <p class="hint" style="text-align:center">${backupTip()}</p>
    <div class="dash">_ _ _ _ _ _ _ _ _ _</div>
    <p class="hint" style="text-align:center">${T.a2hsHint}</p>`;
  return out;
}

/* ---------- sheets ---------- */
function openSheet(html){
  const L = $('#layer');
  L.innerHTML = `<div class="scrim" onclick="WL.close()"></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add('open')));
}
function closeSheet(now){
  const L = $('#layer'); if (!L.innerHTML) return;
  L.classList.remove('open');
  if (now) L.innerHTML = ''; else setTimeout(() => { if (!L.classList.contains('open')) L.innerHTML = ''; }, 260);
}

function keypad(opts){
  // opts: {title, cur, amount, note, onSave(cents,note), onDelete?}
  const C = opts.cur, D = C.dec;
  let s = opts.amount ? inputStr(opts.amount, C).replace(new RegExp('\\' + D + '00$'), '') : '';
  const keys = ['1','2','3','4','5','6','7','8','9',D,'0','⌫'];
  openSheet(`<div class="head"><button class="iconbtn" onclick="WL.close()" aria-label="${T.aria.close}">${I.close}</button><div>${esc(opts.title)}</div><span class="spacer"></span></div>
    <div class="display" id="kd"></div>
    <input class="note" id="kn" placeholder="${T.notePh}" maxlength="40" value="${esc(opts.note || '')}">
    <div class="pad" id="kp">${keys.map(k => `<button type="button" data-k="${k}">${k === '⌫' ? I.del : k}</button>`).join('')}</div>
    ${opts.onDelete ? `<div class="row2"><button class="btn danger" id="kdel">${T.del}</button><button class="btn" id="ks">${T.save}</button></div>` : `<button class="btn block" id="ks">${T.add}</button>`}`);
  const show = () => { const d = $('#kd'), v = s || '0'; d.textContent = C.after ? v + ' ' + C.sym : C.sym + v; d.classList.toggle('placeholder', !s); $('#ks').disabled = !(parseCents(s.replace(D, '.')) > 0); };
  $('#kp').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const k = b.dataset.k;
    if (k === '⌫') s = s.slice(0, -1);
    else if (k === D) { if (!s.includes(D)) s = (s || '0') + D; }
    else { if (s.includes(D) && s.split(D)[1].length >= 2) return; if (s.replace(D, '').length >= 7) return; s = (s === '0' ? '' : s) + k; }
    show(); });
  $('#ks').onclick = () => { const c = parseCents(s.replace(D, '.')); if (c > 0) { opts.onSave(c, $('#kn').value.trim()); } };
  if (opts.onDelete) $('#kdel').onclick = opts.onDelete;
  show();
}

/* ---------- actions ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }

window.WL = {
  close: () => closeSheet(),
  start(){ location.hash = (mobileBrowser() && !browserOk()) ? 'setup' : 'new'; },
  useBrowser(){ try { localStorage.setItem(BKEY, '1'); } catch(e){} location.hash = S.trackings.length ? '' : 'new'; },
  setLang(l){ S.lang = l; save(); applyLang(); render(); },
  markBackup(){ S.lastBackup = Date.now(); delete S.backupSnooze; save(); render(); toast(T.backupSaved); },
  snoozeBackup(){ S.backupSnooze = Date.now(); save(); render(); },
  async install(){ if (!installEvt) return; const e = installEvt; installEvt = null;
    try { e.prompt(); const r = await e.userChoice; if (r && r.outcome === 'accepted') toast(T.installedToast); } catch(err){} render(); },
  setCur(v){ S.cur = v; save(); toast(T.curToast(curName(v))); },
  addExpense(id){ const t = byId(id); keypad({ title: T.addExpenseT, cur: curOf(t), onSave(c, note){ t.expenses.push({ id: uid(), amount: c, note, t: Date.now() }); save(); render(); toast(T.added(fmtFor(t)(c))); } }); },
  editExpense(id, eid){ const t = byId(id), e = t.expenses.find(x => x.id === eid);
    keypad({ title: T.editExpenseT, cur: curOf(t), amount: e.amount, note: e.note,
      onSave(c, note){ e.amount = c; e.note = note; save(); render(); },
      onDelete(){ if (!confirm(T.confirmDelExp)) return; t.expenses = t.expenses.filter(x => x.id !== eid); save(); render(); toast(T.deleted); } }); },
  options(id){ const t = byId(id), ended = t.status === 'ended';
    openSheet(`<div class="head"><button class="iconbtn" onclick="WL.close()" aria-label="${T.aria.close}">${I.close}</button><div>${esc(t.name)}</div><span class="spacer"></span></div>
      <div class="menu">${ended ? `<button class="btn ghost block" onclick="WL.reopen('${id}')">${T.reopen}</button>`
        : `<button class="btn ghost block" onclick="location.hash='edit/${id}'">${T.optEdit}</button>
           <button class="btn ghost block" onclick="WL.end('${id}')">${T.optEnd}</button>`}
      <button class="btn danger block" onclick="WL.remove('${id}')">${T.del}</button></div>`); },
  end(id){ const t = byId(id);
    if (!confirm(T.confirmEnd(t.name, t.period === 'oneoff'))) return;
    t.status = 'ended'; t.endedAt = Date.now(); save(); location.hash = ''; toast(T.savedHist); },
  reopen(id){ const t = byId(id);
    if (t.period !== 'oneoff' && t.end && Date.now() >= t.end) { t.period = 'oneoff'; t.end = null; }
    t.status = 'active'; delete t.endedAt; save(); render(); toast(T.reopened); },
  remove(id){ const t = byId(id); if (!confirm(T.confirmRemove(t.name))) return;
    S.trackings = S.trackings.filter(x => x.id !== id); save(); location.hash = ''; render(); toast(T.deleted); },
  async exportData(){
    const name = 'whats-left-backup-' + new Date().toISOString().slice(0,10) + '.json';
    const blob = new Blob([JSON.stringify({ app: 'whats-left', version: 1, exported: Date.now(), ...S }, null, 1)], { type: 'application/json' });
    try { const f = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: "What's Left? backup" }); WL.markBackup(); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); WL.markBackup();
  },
  importData(input){ const f = input.files && input.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.trackings)) throw 0;
        if (!confirm(T.confirmImport(d.trackings.length))) return;
        S = { trackings: d.trackings, cur: d.cur || S.cur, lang: S.lang, lastBackup: d.exported || S.lastBackup }; migrate(); save(); rollover(); location.hash = ''; render(); toast(T.restored);
      } catch(e){ toast(T.notBackup); } finally { input.value = ''; } };
    r.readAsText(f); }
};

/* ---------- start ---------- */
load(); migrate(); applyLang(); rollover(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
