<style>
:root{
  --bg:#f3f0eb; --surface:#fbf9f6; --sand:#e6dccd; --sand-2:#d6c7b2;
  --brown:#6b3f1e; --brown-2:#4f2e16; --ink:#3a2a1e; --muted:#8a7866;
  --line:#e2d9cc; --over:#a2402c; --over-bg:#f3e1da;
  --r:18px; --pill:999px;
  --head:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Assistant',-apple-system,'Segoe UI',Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:calc(var(--st) + 8px) 20px calc(var(--sb) + 40px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:6px}
.brand{font-family:var(--body);letter-spacing:.28em;text-transform:uppercase;font-size:14px;font-weight:600;color:var(--ink)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.iconbtn:active{background:var(--sand)}
.iconbtn svg{width:22px;height:22px}
.spacer{width:40px}

.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:28px 0 12px}
h2.sec{font-weight:400;font-size:22px;margin:30px 0 14px;color:var(--brown-2)}
.hero-line{font-family:var(--head);text-transform:uppercase;font-weight:600;font-size:34px;line-height:1.02;letter-spacing:.01em;margin:10px 0 6px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 28px;border-radius:var(--pill);background:var(--brown);color:#f7f1e8;font-weight:600;font-size:16px;letter-spacing:.01em}
.btn:active{background:var(--brown-2)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--brown);box-shadow:inset 0 0 0 1.5px var(--brown)}
.btn.ghost:active{background:var(--sand)}
.btn.danger{background:transparent;color:var(--over);box-shadow:inset 0 0 0 1.5px var(--over)}
.btn:disabled{opacity:.4}
.link{color:var(--brown);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:12px;border:1px solid var(--line)}
.card:active{transform:scale(.99)}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .name{font-weight:600;font-size:17px}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:var(--ink);color:#f3ede4;border-radius:var(--pill);padding:3px 10px}
.tag.soft{background:var(--sand);color:var(--brown-2)}
.card .amt{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;margin-top:10px;letter-spacing:.01em}
.card .amt small{font-family:var(--body);font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.card .meta{color:var(--muted);font-size:14px;margin-top:2px}
.bar{height:8px;background:var(--sand);border-radius:var(--pill);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--brown);border-radius:var(--pill)}
.bar.over>i{background:var(--over)}
.neg{color:var(--over)}

/* big detail */
.big{background:var(--sand);border-radius:24px;padding:26px 22px 22px;text-align:center;margin-top:18px}
.big.over{background:var(--over-bg)}
.big .n{font-family:var(--head);font-weight:600;font-size:56px;line-height:1;letter-spacing:.01em}
.big .l{margin-top:8px;color:var(--brown-2)}
.big .bar{background:rgba(255,255,255,.6);height:10px;margin-top:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-family:var(--head);font-weight:500;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:active{background:var(--bg)}
.item .dot{width:36px;height:36px;border-radius:50%;background:var(--sand);display:grid;place-items:center;flex:none;color:var(--brown)}
.item .dot svg{width:17px;height:17px}
.item .t{flex:1;min-width:0}
.item .t div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted)}
.item .v{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 16px}
.dash{color:var(--sand-2);letter-spacing:.25em;text-align:center;margin:26px 0 0}

/* forms */
label.f{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 8px}
.inp{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;outline:none}
.inp:focus{border-color:var(--brown)}
.money{position:relative}
.money .inp{padding-left:44px;font-family:var(--head);font-size:24px;font-weight:500}
.money .sym{position:absolute;left:16px;top:50%;transform:translateY(-52%);font-family:var(--head);font-size:22px;color:var(--muted);pointer-events:none}
.money.after .inp{padding-left:16px;padding-right:48px}
.money.after .sym{left:auto;right:16px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px;font-size:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:42px;padding:0 18px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.seg button[aria-pressed=true]{background:var(--ink);color:#f3ede4;border-color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.actions{display:grid;gap:10px;margin-top:30px}

/* sheet + keypad */
.scrim{position:fixed;inset:0;background:rgba(40,26,16,.35);opacity:0;transition:opacity .2s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(var(--sb) + 18px);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:11;max-height:94dvh;overflow:auto}
.open .scrim{opacity:1}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--sand-2);margin:0 auto 6px}
.sheet .head{display:flex;align-items:center;justify-content:space-between}
.sheet .head div{font-weight:600}
.display{text-align:center;font-family:var(--head);font-weight:600;font-size:54px;margin:12px 0 4px;letter-spacing:.01em}
.display.placeholder{color:var(--sand-2)}
.note{display:block;margin:0 auto 14px;width:220px;height:40px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);text-align:center;font-size:16px;outline:none}
.note:focus{border-color:var(--brown)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pad button{height:58px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:24px;font-weight:600}
.pad button:active{background:var(--sand)}
.pad svg{width:24px;height:24px;vertical-align:middle}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}

.toast{position:fixed;left:50%;top:calc(var(--st) + 60px);transform:translate(-50%,-12px);background:var(--ink);color:#f3ede4;padding:10px 18px;border-radius:var(--pill);font-size:15px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}
.menu{display:grid;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const KEY = 'whatsleft.v1';
const DAY = 864e5;
const PERIODS = {weekly:'Weekly', fortnightly:'Fortnightly', monthly:'Monthly', oneoff:'One-off'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- storage ---------- */
let S = { trackings: [] };
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch(e){} if (!Array.isArray(S.trackings)) S = {trackings:[]}; }
function migrate(){ if (!CUR[S.cur]) S.cur = 'EUR'; S.trackings.forEach(t => { if (!CUR[t.cur]) t.cur = S.cur; }); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Could not save on this device.'); } }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- money & dates ---------- */
const CUR = {
  EUR:{name:'Euro', sym:'€', after:true, dec:',', grp:'\u00a0'},
  GBP:{name:'Pound sterling', sym:'£', after:false, dec:'.', grp:','},
  USD:{name:'US dollar', sym:'$', after:false, dec:'.', grp:','},
  AUD:{name:'Australian dollar', sym:'A$', after:false, dec:'.', grp:','},
  SEK:{name:'Swedish krona', sym:'kr', after:true, dec:',', grp:'\u00a0'},
  NOK:{name:'Norwegian krone', sym:'kr', after:true, dec:',', grp:'\u00a0'},
  DKK:{name:'Danish krone', sym:'kr', after:true, dec:',', grp:'.'}
};
const curOf = t => CUR[(t && t.cur) || S.cur] || CUR.EUR;
function num(c, C){ const a = Math.abs(c), w = Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, C.grp);
  return w + C.dec + String(a % 100).padStart(2, '0'); }
function money(c, C){ const n = num(c, C), sign = c < 0 ? '−' : '';
  return C.after ? sign + n + '\u00a0' + C.sym : sign + C.sym + n; }
const fmtFor = t => { const C = curOf(t); return c => money(c, C); };
function parseFor(str, C){ let v = String(str).replace(/[\s\u00a0]/g, '');
  const other = C.dec === ',' ? '.' : ',';
  if (v.includes(C.dec)) v = v.split(other).join('');
  else if (v.includes(other) && /[.,]\d{1,2}$/.test(v) && v.split(other).length === 2) v = v.replace(other, C.dec);
  else v = v.split(other).join('');
  return parseCents(v.replace(C.dec, '.')); }
const inputStr = (c, C) => c ? (c / 100).toFixed(2).replace('.', C.dec) : '';
function parseCents(str){ const s = String(str).replace(/\s/g,'').replace(',', '.'); if (!/^\d*\.?\d{0,2}$/.test(s) || s === '' || s === '.') return NaN; return Math.round(parseFloat(s) * 100); }
const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function addPeriod(t, p){ const d = new Date(t);
  if (p === 'weekly') d.setDate(d.getDate() + 7);
  else if (p === 'fortnightly') d.setDate(d.getDate() + 14);
  else if (p === 'monthly') d.setMonth(d.getMonth() + 1);
  return d.getTime(); }
const dfmt = new Intl.DateTimeFormat('en-GB', {day:'numeric', month:'short'});
const tfmt = new Intl.DateTimeFormat('en-GB', {hour:'2-digit', minute:'2-digit'});
function when(t){ const today = startOfDay(Date.now()), d = startOfDay(t);
  const day = d === today ? 'Today' : d === today - DAY ? 'Yesterday' : dfmt.format(t);
  return day + ', ' + tfmt.format(t); }
const range = t => dfmt.format(t.start) + ' – ' + dfmt.format((t.endedAt || t.end || Date.now()) - (t.end && !t.endedAt ? 1 : 0));

/* ---------- model ---------- */
const spent = t => t.expenses.reduce((a, e) => a + e.amount, 0);
const hasBudget = t => t.mode === 'budget';
const active = () => S.trackings.filter(t => t.status === 'active').sort((a,b) => a.created - b.created);
const history = () => S.trackings.filter(t => t.status === 'ended').sort((a,b) => (b.endedAt||0) - (a.endedAt||0));
const byId = id => S.trackings.find(t => t.id === id);

function rollover(){
  const now = Date.now(); let changed = false;
  for (const t0 of active()) {
    let t = t0;
    while (t.period !== 'oneoff' && t.end && now >= t.end) {
      t.status = 'ended'; t.endedAt = t.end;
      const n = { id: uid(), name: t.name, mode: t.mode, amount: t.amount, period: t.period, cur: t.cur,
        start: t.end, end: addPeriod(t.end, t.period), created: t.created, status: 'active', expenses: [] };
      S.trackings.push(n); t = n; changed = true;
    }
  }
  if (changed) save();
}

function summary(t){
  const s = spent(t), now = Date.now();
  const o = { spent: s, left: hasBudget(t) ? t.amount - s : null, pct: 0, over: false, days: null, perDay: null };
  if (hasBudget(t)) { o.pct = t.amount > 0 ? Math.min(100, s / t.amount * 100) : 100; o.over = o.left < 0; }
  if (t.end && t.status === 'active') {
    o.days = Math.max(1, Math.ceil((t.end - now) / DAY));
    if (hasBudget(t) && o.left > 0) o.perDay = Math.floor(o.left / o.days);
  }
  return o;
}

/* ---------- router ---------- */
const go = h => { location.hash = h; };
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollover(); render(); } });

function render(){
  closeSheet(true);
  const h = location.hash.replace(/^#\/?/, '');
  const [view, id] = h.split('/');
  const app = $('#app');
  if (view === 't' && byId(id)) app.innerHTML = viewTracking(byId(id));
  else if (view === 'new') app.innerHTML = viewForm(null);
  else if (view === 'edit' && byId(id)) app.innerHTML = viewForm(byId(id));
  else if (view === 'backup') app.innerHTML = viewBackup();
  else app.innerHTML = viewHome();
  if (view === 'new' || view === 'edit') bindForm(view === 'edit' ? byId(id) : null);
  window.scrollTo(0, 0);
}

/* ---------- views ---------- */
function top(left, right){ return `<div class="top">${left || '<span class="spacer"></span>'}<div class="brand">What's Left?</div>${right || '<span class="spacer"></span>'}</div>`; }
const backBtn = (to='') => `<button class="iconbtn" aria-label="Back" onclick="location.hash='${to}'">${I.back}</button>`;

function cardFor(t){
  const m = summary(t), eur = fmtFor(t);
  const tag = t.period === 'oneoff' ? '' : `<span class="tag soft">${PERIODS[t.period]}</span>`;
  let amt, meta = '', bar = '';
  if (hasBudget(t)) {
    amt = `<span class="${m.over ? 'neg' : ''}">${eur(m.over ? -m.left : m.left)}</span><small>${m.over ? 'over' : 'left'}</small>`;
    bar = `<div class="bar ${m.over ? 'over' : ''}"><i style="width:${m.pct}%"></i></div>`;
    meta = m.days ? `${m.days} day${m.days>1?'s':''} left${m.perDay != null ? ' · ' + eur(m.perDay) + ' per day' : ''}` : `${eur(m.spent)} of ${eur(t.amount)} spent`;
  } else {
    amt = `${eur(m.spent)}<small>spent</small>`;
    meta = `${t.expenses.length} purchase${t.expenses.length === 1 ? '' : 's'}${m.days ? ' · ' + m.days + ' day' + (m.days>1?'s':'') + ' left' : ''}`;
  }
  return `<button class="card" onclick="location.hash='t/${t.id}'">
    <div class="row"><span class="name">${esc(t.name)}</span>${tag}</div>
    <div class="amt">${amt}</div>${bar}<div class="meta">${meta}</div></button>`;
}

function viewHome(){
  const a = active(), h = history();
  const menu = `<button class="iconbtn" aria-label="Settings" onclick="location.hash='backup'">${I.menu}</button>`;
  let out = top('', menu);
  if (!a.length && !h.length) {
    out += `<div class="eyebrow">make invisible spending visible</div>
      <div class="hero-line">Spend it.<br>See it.</div>
      <p class="sub">Start with an amount, or simply start at zero. Add purchases as you make them and always see where you stand.</p>
      <div class="actions"><button class="btn block" onclick="location.hash='new'">start tracking</button></div>
      <div class="dash">_ _ _ _ _ _ _ _ _ _</div>`;
    return out + foot();
  }
  out += `<div class="eyebrow">active</div>`;
  out += a.length ? a.map(cardFor).join('') : `<div class="list"><div class="empty">Nothing running right now.</div></div>`;
  out += `<div class="actions" style="margin-top:14px"><button class="btn block" onclick="location.hash='new'">${I.plus} new tracking</button></div>`;
  out += `<h2 class="sec">history</h2>`;
  out += h.length ? `<div class="list">${h.map(histItem).join('')}</div>` : `<div class="list"><div class="empty">Finished trackings are saved here.</div></div>`;
  return out + foot();
}
function histItem(t){
  const s = spent(t), eur = fmtFor(t);
  let v = eur(s), sub = range(t);
  if (hasBudget(t)) { const d = t.amount - s; sub += ' · ' + (d >= 0 ? eur(d) + ' under' : eur(-d) + ' over'); }
  return `<button class="item" onclick="location.hash='t/${t.id}'"><div class="t"><div>${esc(t.name)}</div><span>${sub}</span></div><div class="v">${v}</div></button>`;
}
const curSelect = (id, v, on='') => `<select class="inp" id="${id}" ${on ? `onchange="${on}"` : ''}>${Object.entries(CUR).map(([k,c]) => `<option value="${k}" ${k===v?'selected':''}>${c.name} (${c.sym}) · ${money(123456, c)}</option>`).join('')}</select>`;
const foot = () => `<div class="foot">Saved only on this phone.<br><a class="link" href="#backup">Settings &amp; backup</a></div>`;

function viewTracking(t){
  const m = summary(t), ended = t.status === 'ended', eur = fmtFor(t);
  const more = `<button class="iconbtn" aria-label="Options" onclick="WL.options('${t.id}')">${I.more}</button>`;
  let out = top(backBtn(''), more);
  out += `<div class="eyebrow" style="margin-top:14px">${ended ? 'history · ' + range(t) : (t.period === 'oneoff' ? 'one-off' : PERIODS[t.period].toLowerCase() + ' · ' + range(t))}</div>`;
  out += `<div class="hero-line" style="font-size:30px">${esc(t.name)}</div>`;
  if (hasBudget(t)) {
    out += `<div class="big ${m.over ? 'over' : ''}"><div class="n ${m.over ? 'neg' : ''}">${eur(m.over ? -m.left : m.left)}</div>
      <div class="l">${m.over ? 'over budget' : (ended ? 'was left' : 'left')}</div>
      <div class="bar ${m.over ? 'over' : ''}"><i style="width:${m.pct}%"></i></div></div>`;
    out += `<div class="stats">`;
    if (!ended && m.days) out += `<div class="stat"><b>${m.days}</b><span>day${m.days>1?'s':''} remaining</span></div><div class="stat"><b>${m.perDay != null ? eur(m.perDay) : '—'}</b><span>per day</span></div>`;
    else out += `<div class="stat"><b>${eur(m.spent)}</b><span>spent</span></div><div class="stat"><b>${eur(t.amount)}</b><span>budget</span></div>`;
    out += `</div>`;
  } else {
    out += `<div class="big"><div class="n">${eur(m.spent)}</div><div class="l">spent${t.expenses.length ? ' · ' + t.expenses.length + ' purchase' + (t.expenses.length>1?'s':'') : ''}</div></div>`;
  }
  if (!ended) out += `<div class="actions" style="margin-top:16px"><button class="btn block" onclick="WL.addExpense('${t.id}')">${I.plus} add expense</button></div>`;
  else out += `<div class="actions" style="margin-top:16px"><button class="btn ghost block" onclick="WL.reopen('${t.id}')">reopen</button></div>`;
  out += `<h2 class="sec">purchases</h2>`;
  const ex = [...t.expenses].sort((a,b) => b.t - a.t);
  out += ex.length ? `<div class="list">${ex.map(e => `<button class="item" onclick="WL.editExpense('${t.id}','${e.id}')"><span class="dot">${I.coin}</span><div class="t"><div>${esc(e.note || 'Purchase')}</div><span>${when(e.t)}</span></div><div class="v">${eur(e.amount)}</div></button>`).join('')}</div>`
    : `<div class="list"><div class="empty">Nothing added yet.</div></div>`;
  return out;
}

function viewForm(t){
  const e = t || { name:'', mode:'budget', amount:0, period:'weekly', cur: S.cur || 'EUR' };
  const C = CUR[e.cur] || CUR.EUR;
  let out = top(backBtn(t ? 't/' + t.id : ''), '');
  out += `<div class="hero-line" style="margin-top:16px">${t ? 'Edit.' : 'New tracking.'}</div>`;
  out += `<label class="f" for="fName">name</label><input class="inp" id="fName" maxlength="40" placeholder="e.g. Weekly budget, Christmas shopping" value="${esc(e.name)}">`;
  out += `<label class="f">how do you want to start?</label><div class="seg" id="fMode">
    <button type="button" data-v="budget" aria-pressed="${e.mode==='budget'}">with an amount</button>
    <button type="button" data-v="zero" aria-pressed="${e.mode==='zero'}">at zero</button></div>`;
  out += `<label class="f" for="fCur">currency</label>${curSelect('fCur', e.cur || 'EUR')}`;
  out += `<div id="fAmtWrap"><label class="f" for="fAmt">how much do you have to spend?</label><div class="money ${C.after ? 'after' : ''}" id="fMoney"><span class="sym" id="fSym">${C.sym}</span><input class="inp" id="fAmt" inputmode="decimal" autocomplete="off" placeholder="0${C.dec}00" value="${inputStr(e.amount, C)}"></div></div>`;
  out += `<label class="f">period</label><div class="seg" id="fPeriod">${Object.entries(PERIODS).map(([k,v]) => `<button type="button" data-v="${k}" aria-pressed="${e.period===k}">${v}</button>`).join('')}</div>`;
  out += `<p class="hint" id="fHint"></p>`;
  out += `<div class="actions"><button class="btn block" id="fSave">${t ? 'save' : "let's go"}</button></div>`;
  return out;
}
function bindForm(t){
  let mode = t ? t.mode : 'budget', period = t ? t.period : 'weekly', C0 = curOf(t || { cur: S.cur });
  $('#fCur').onchange = () => { const prev = C0, C = CUR[$('#fCur').value], v = parseFor($('#fAmt').value, prev); C0 = C;
    $('#fSym').textContent = C.sym; $('#fMoney').classList.toggle('after', C.after);
    $('#fAmt').placeholder = '0' + C.dec + '00'; if (v > 0) $('#fAmt').value = inputStr(v, C); };
  const seg = (id, set) => $(id).addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); set(b.dataset.v); upd(); });
  const upd = () => {
    $('#fAmtWrap').style.display = mode === 'budget' ? '' : 'none';
    $('#fHint').textContent = period === 'oneoff'
      ? 'Runs until you end it. Good for a trip, a shopping day or Christmas.'
      : `Starts ${t ? dfmt.format(t.start) : 'today'}. When the ${period === 'monthly' ? 'month' : period === 'weekly' ? 'week' : 'fortnight'} ends, it's saved to history and a fresh one begins.`;
  };
  seg('#fMode', v => mode = v); seg('#fPeriod', v => period = v); upd();
  if (!t) setTimeout(() => $('#fName').focus(), 50);
  $('#fSave').onclick = () => {
    const cur = $('#fCur').value;
    const name = $('#fName').value.trim() || (period === 'oneoff' ? 'Tracking' : PERIODS[period] + ' budget');
    let amount = 0;
    if (mode === 'budget') { amount = parseFor($('#fAmt').value, CUR[cur]); if (!(amount > 0)) { toast('Add an amount, or choose “at zero”.'); $('#fAmt').focus(); return; } }
    if (t) {
      Object.assign(t, { name, mode, amount, cur });
      if (t.period !== period) { t.period = period; t.end = period === 'oneoff' ? null : addPeriod(t.start, period); }
      save(); rollover(); go('t/' + (t.status === 'active' ? t.id : active().slice(-1)[0]?.id || ''));
    } else {
      const start = startOfDay(Date.now());
      S.cur = cur;
      const n = { id: uid(), name, mode, amount, period, cur, start, end: period === 'oneoff' ? null : addPeriod(start, period), created: Date.now(), status: 'active', expenses: [] };
      S.trackings.push(n); save(); location.replace('#t/' + n.id);
    }
  };
}

function viewBackup(){
  const n = S.trackings.length, ex = S.trackings.reduce((a,t) => a + t.expenses.length, 0);
  let out = top(backBtn(''), '');
  out += `<div class="hero-line" style="margin-top:16px">Settings.</div>
    <p class="sub">Everything lives only on this phone. Nothing is sent anywhere. Clearing your browser data or deleting the app removes it, so keep a backup.</p>
    <label class="f" for="sCur">default currency</label>${curSelect('sCur', S.cur || 'EUR', "WL.setCur(this.value)")}
    <p class="hint">Used for new trackings. Existing trackings keep their own currency.</p>
    <div class="stats" style="margin-top:18px"><div class="stat"><b>${n}</b><span>trackings</span></div><div class="stat"><b>${ex}</b><span>purchases</span></div></div>
    <div class="actions"><button class="btn block" onclick="WL.exportData()">save a backup</button>
    <button class="btn ghost block" onclick="document.getElementById('imp').click()">restore from backup</button>
    <input type="file" id="imp" accept="application/json,.json" hidden onchange="WL.importData(this)"></div>
    <div class="dash">_ _ _ _ _ _ _ _ _ _</div>
    <p class="hint" style="text-align:center">Add to your home screen: in Safari tap Share → Add to Home Screen.<br>On Android, open the Chrome menu → Add to Home screen.</p>`;
  return out;
}

/* ---------- sheets ---------- */
function openSheet(html){
  const L = $('#layer');
  L.innerHTML = `<div class="scrim" onclick="WL.close()"></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => L.classList.add('open')));
}
function closeSheet(now){
  const L = $('#layer'); if (!L.innerHTML) return;
  L.classList.remove('open');
  if (now) L.innerHTML = ''; else setTimeout(() => { if (!L.classList.contains('open')) L.innerHTML = ''; }, 260);
}

function keypad(opts){
  // opts: {title, cur, amount, note, onSave(cents,note), onDelete?}
  const C = opts.cur, D = C.dec;
  let s = opts.amount ? inputStr(opts.amount, C).replace(new RegExp('\\' + D + '00$'), '') : '';
  const keys = ['1','2','3','4','5','6','7','8','9',D,'0','⌫'];
  openSheet(`<div class="head"><button class="iconbtn" onclick="WL.close()" aria-label="Close">${I.close}</button><div>${esc(opts.title)}</div><span class="spacer"></span></div>
    <div class="display" id="kd"></div>
    <input class="note" id="kn" placeholder="Optional note" maxlength="40" value="${esc(opts.note || '')}">
    <div class="pad" id="kp">${keys.map(k => `<button type="button" data-k="${k}">${k === '⌫' ? I.del : k}</button>`).join('')}</div>
    ${opts.onDelete ? `<div class="row2"><button class="btn danger" id="kdel">delete</button><button class="btn" id="ks">save</button></div>` : `<button class="btn block" id="ks">add</button>`}`);
  const show = () => { const d = $('#kd'), v = s || '0'; d.textContent = C.after ? v + ' ' + C.sym : C.sym + v; d.classList.toggle('placeholder', !s); $('#ks').disabled = !(parseCents(s.replace(D, '.')) > 0); };
  $('#kp').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; const k = b.dataset.k;
    if (k === '⌫') s = s.slice(0, -1);
    else if (k === D) { if (!s.includes(D)) s = (s || '0') + D; }
    else { if (s.includes(D) && s.split(D)[1].length >= 2) return; if (s.replace(D, '').length >= 7) return; s = (s === '0' ? '' : s) + k; }
    show(); });
  $('#ks').onclick = () => { const c = parseCents(s.replace(D, '.')); if (c > 0) { opts.onSave(c, $('#kn').value.trim()); } };
  if (opts.onDelete) $('#kdel').onclick = opts.onDelete;
  show();
}

/* ---------- actions ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }

window.WL = {
  close: () => closeSheet(),
  setCur(v){ S.cur = v; save(); toast('New trackings will use ' + CUR[v].name.toLowerCase()); },
  addExpense(id){ const t = byId(id); keypad({ title: 'Add expense', cur: curOf(t), onSave(c, note){ t.expenses.push({ id: uid(), amount: c, note, t: Date.now() }); save(); render(); toast(fmtFor(t)(c) + ' added'); } }); },
  editExpense(id, eid){ const t = byId(id), e = t.expenses.find(x => x.id === eid);
    keypad({ title: 'Edit expense', cur: curOf(t), amount: e.amount, note: e.note,
      onSave(c, note){ e.amount = c; e.note = note; save(); render(); },
      onDelete(){ if (!confirm('Delete this purchase?')) return; t.expenses = t.expenses.filter(x => x.id !== eid); save(); render(); toast('Deleted'); } }); },
  options(id){ const t = byId(id), ended = t.status === 'ended';
    openSheet(`<div class="head"><button class="iconbtn" onclick="WL.close()" aria-label="Close">${I.close}</button><div>${esc(t.name)}</div><span class="spacer"></span></div>
      <div class="menu">${ended ? `<button class="btn ghost block" onclick="WL.reopen('${id}')">reopen</button>`
        : `<button class="btn ghost block" onclick="location.hash='edit/${id}'">edit name, amount or period</button>
           <button class="btn ghost block" onclick="WL.end('${id}')">end &amp; save to history</button>`}
      <button class="btn danger block" onclick="WL.remove('${id}')">delete</button></div>`); },
  end(id){ const t = byId(id);
    if (!confirm(t.period === 'oneoff' ? `End “${t.name}” and save it to history?` : `End “${t.name}”? It's saved to history and won't start again next ${t.period === 'monthly' ? 'month' : 'period'}.`)) return;
    t.status = 'ended'; t.endedAt = Date.now(); save(); location.hash = ''; toast('Saved to history'); },
  reopen(id){ const t = byId(id);
    if (t.period !== 'oneoff' && t.end && Date.now() >= t.end) { t.period = 'oneoff'; t.end = null; }
    t.status = 'active'; delete t.endedAt; save(); render(); toast('Reopened'); },
  remove(id){ const t = byId(id); if (!confirm(`Delete “${t.name}” and all its purchases? This can't be undone.`)) return;
    S.trackings = S.trackings.filter(x => x.id !== id); save(); location.hash = ''; render(); toast('Deleted'); },
  async exportData(){
    const name = 'whats-left-backup-' + new Date().toISOString().slice(0,10) + '.json';
    const blob = new Blob([JSON.stringify({ app: 'whats-left', version: 1, exported: Date.now(), ...S }, null, 1)], { type: 'application/json' });
    try { const f = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: "What's Left? backup" }); return; }
    } catch(e){ if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup saved');
  },
  importData(input){ const f = input.files && input.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.trackings)) throw 0;
        if (!confirm(`Replace everything on this phone with the backup (${d.trackings.length} trackings)?`)) return;
        S = { trackings: d.trackings, cur: d.cur || S.cur }; migrate(); save(); rollover(); location.hash = ''; render(); toast('Restored');
      } catch(e){ toast("That file isn't a What's Left? backup."); } finally { input.value = ''; } };
    r.readAsText(f); }
};

/* ---------- start ---------- */
load(); migrate(); rollover(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
